<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EE OG image</title>
<meta name="viewport" content="width=1200">
<style>
  /* Rendered by capture.mjs at 1200x630. Never served in production. No external resources. */
  :root {
    --blue: #00a1f1;
    --navy-500: #005376;
    --navy-700: #003348;
    --navy-900: #001f2b;
    --bg: #f2f2f2;
    --surface: #ffffff;
    --border: #dcdcdc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--navy-900);
    font-family: "Lato", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    position: relative;
  }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 16px; background: var(--blue); }
  .text { position: absolute; left: 80px; top: 0; bottom: 0; width: 640px; display: flex;
          flex-direction: column; justify-content: center; }
  .brand { font-size: 34px; font-weight: 700; color: var(--navy-500); letter-spacing: 0.2px;
           margin: 0 0 28px; }
  .title { font-size: 60px; line-height: 1.1; font-weight: 700; margin: 0; color: var(--navy-900); }
  .phone { position: absolute; right: 90px; top: 70px; width: 330px; height: 714px;
           border-radius: 40px; border: 10px solid var(--navy-900); background: var(--surface);
           overflow: hidden; box-shadow: 0 20px 50px rgba(0, 31, 43, 0.25); }
  .phone img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="text">
    <p class="brand">Everything Everywhere</p>
    <h1 class="title" id="title"></h1>
  </div>
  <div class="phone"><img id="shot" alt=""></div>
  <script>
    var TITLES = {
      en: "Your money, home and habits in one place",
      fr: "Votre argent, votre foyer et vos habitudes au même endroit"
    };
    var lang = new URLSearchParams(location.search).get("lang") === "fr" ? "fr" : "en";
    document.documentElement.lang = lang;
    document.getElementById("title").textContent = TITLES[lang];
    document.getElementById("shot").src = "../../frontend/landing/img/" + lang + "-dashboard.webp";
  </script>
</body>
</html>
