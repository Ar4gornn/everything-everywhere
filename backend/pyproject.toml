[project]
name = "everything-everywhere"
version = "0.1.0"
description = "Everything Everywhere — a personal finance tracker with per-user isolation enforced by Postgres RLS"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy==2.0.52",
    "alembic==1.19.1",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.5",
    "email-validator==2.3.0",
    "pydantic-settings==2.15.0",
    "argon2-cffi==25.1.0",
    "pyjwt==2.13.0",
    # Web Push, from web-push-libs — the same org as the reference JS implementation.
    # MPL-2.0. `notify.py` sends the digest with it; the API sends only the one push a
    # person asks for from Settings ("Send test", Epic 36, AD-52).
    "pywebpush==2.5.0",
    # The IANA zone database, from the PSF. `zoneinfo` reads the OS copy when there is one;
    # Windows has none and python:3.13-slim is not guaranteed one, so it is pinned here
    # rather than left to arrive as someone else's transitive dependency (Epic 36).
    "tzdata==2026.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    # anyio 4.15 deprecated the anyio.abc.BlockingPortal alias and starlette 1.6's testclient
    # still imports it, so a fresh install could not even collect the suite. Upstream's to
    # fix; a test-client alias is not this application's code.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
# Test fixtures carry obvious dummy passwords, and build SQL from identifiers they
# themselves chose — not from anything a user supplies.
"tests/*" = ["S105", "S106", "S107", "S608"]
# Migrations interpolate role and table names that come from configuration and from the
# migration itself. Postgres has no bind parameters for identifiers.
"migrations/*" = ["S608"]
