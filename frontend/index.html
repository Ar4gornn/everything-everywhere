<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the app draws under the notch when installed on iOS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />

    <title>Everything Everywhere</title>
    <meta name="description" content="Track what you earn, spend and save." />

    <link rel="manifest" href="/manifest.webmanifest?v=3" />

    <!-- One value, set by theme.js to the chosen mode's background. -->
    <meta name="theme-color" content="#f2f2f2" />
    <!-- Blocking on purpose, before the stylesheet paints: see the file. ?v= is bumped on change. -->
    <script src="/theme.js?v=2"></script>

    <!-- iOS ignores the manifest for these three. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EEwhere" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
